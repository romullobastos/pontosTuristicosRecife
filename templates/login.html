<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>Entrar • Recife Turístico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(234, 102, 182, 0.1) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .card { 
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px; 
      box-shadow: 0 25px 50px rgba(0,0,0,0.3); 
      max-width: 420px; 
      width: 100%; 
      overflow: hidden;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
      padding: 32px 28px;
      text-align: center;
      color: white;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-header .icon {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }

    .card-header h1 { 
      font-size: 24px; 
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #fff 0%, #a8b4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card-header p { 
      opacity: 0.8; 
      font-size: 14px; 
      color: rgba(255, 255, 255, 0.9);
    }

    .card-body {
      padding: 28px;
    }

    .input-group { margin-bottom: 18px; }

    .input-group label { 
      display: block; 
      margin-bottom: 8px; 
      color: rgba(255, 255, 255, 0.9); 
      font-weight: 600; 
      font-size: 14px; 
    }

    .input-group input { 
      width: 100%; 
      padding: 14px 16px; 
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.1); 
      border-radius: 12px; 
      font-size: 15px; 
      color: #fff;
      transition: all 0.2s ease;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .input-group input:focus { 
      outline: none; 
      border-color: #667eea; 
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 4px rgba(102,126,234,0.2); 
    }

    .btn { 
      width: 100%; 
      border: none; 
      border-radius: 12px; 
      padding: 14px 20px; 
      color: #fff; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      font-weight: 700; 
      font-size: 15px;
      cursor: pointer; 
      margin-top: 8px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102,126,234,0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider span { padding: 0 16px; }

    .links { 
      display: flex; 
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    .links a { 
      color: #a8b4ff; 
      text-decoration: none; 
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .links a:hover { 
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #a8b4ff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(102, 126, 234, 0.3);
      color: white;
      border-color: rgba(102, 126, 234, 0.5);
    }

    .msg { 
      display: block; 
      margin-top: 16px; 
      padding: 12px 14px; 
      border-radius: 10px; 
      font-size: 14px;
      text-align: center;
    }

    .msg.error { 
      background: rgba(255, 100, 100, 0.15); 
      border: 1px solid rgba(255, 100, 100, 0.3); 
      color: #ff9999; 
    }

    .msg.success { 
      background: rgba(100, 255, 150, 0.15); 
      border: 1px solid rgba(100, 255, 150, 0.3); 
      color: #90ffb0; 
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .card-header { padding: 24px 20px; }
      .card-body { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="icon">🏛️</div>
      <h1>Bem-vindo de volta!</h1>
      <p>Entre para explorar o Recife histórico</p>
    </div>
    <div class="card-body">
      <form method="POST" action="/login">
        <div class="input-group">
          <label for="username">Usuário</label>
          <input id="username" name="username" type="text" placeholder="Seu nome de usuário" required />
        </div>
        <div class="input-group">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" placeholder="Sua senha" required />
        </div>
        <button class="btn" type="submit">Entrar</button>
        {% if error %}
        <div class="msg error">{{ error }}</div>
        {% endif %}
      </form>
      <div class="divider"><span>ou</span></div>
      <div class="links">
        <a href="/register" class="btn btn-secondary">Criar nova conta</a>
        <a href="/reset">Esqueci minha senha</a>
      </div>
    </div>
  </div>
</body>
</html>
