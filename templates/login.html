<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar • Pontos Turísticos Recife</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
    }
    .card { 
      background: #fff; 
      border-radius: 24px; 
      box-shadow: 0 25px 50px rgba(0,0,0,0.25); 
      max-width: 420px; 
      width: 100%; 
      overflow: hidden;
    }
    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 32px 28px;
      text-align: center;
      color: white;
    }
    .card-header .icon {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }
    .card-header h1 { 
      font-size: 24px; 
      font-weight: 700;
      margin-bottom: 6px;
    }
    .card-header p { 
      opacity: 0.9; 
      font-size: 14px; 
    }
    .card-body {
      padding: 28px;
    }
    .input-group { margin-bottom: 18px; }
    .input-group label { 
      display: block; 
      margin-bottom: 8px; 
      color: #444; 
      font-weight: 600; 
      font-size: 14px; 
    }
    .input-group input { 
      width: 100%; 
      padding: 14px 16px; 
      border: 2px solid #e8e8f0; 
      border-radius: 12px; 
      font-size: 15px; 
      transition: all 0.2s ease;
    }
    .input-group input:focus { 
      outline: none; 
      border-color: #667eea; 
      box-shadow: 0 0 0 4px rgba(102,126,234,0.15); 
    }
    .btn { 
      width: 100%; 
      border: none; 
      border-radius: 12px; 
      padding: 14px 20px; 
      color: #fff; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      font-weight: 700; 
      font-size: 15px;
      cursor: pointer; 
      margin-top: 8px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102,126,234,0.4);
    }
    .btn:active {
      transform: translateY(0);
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #999;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e8e8f0;
    }
    .divider span { padding: 0 16px; }
    .links { 
      display: flex; 
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .links a { 
      color: #667eea; 
      text-decoration: none; 
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .links a:hover { 
      color: #764ba2;
    }
    .btn-secondary {
      background: #f5f6ff;
      color: #667eea;
      border: 2px solid #e0e4ff;
    }
    .btn-secondary:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    .msg { 
      display: block; 
      margin-top: 16px; 
      padding: 12px 14px; 
      border-radius: 10px; 
      font-size: 14px;
      text-align: center;
    }
    .msg.error { 
      background: #ffeaea; 
      border: 1px solid #f3b5b5; 
      color: #b42323; 
    }
    .msg.success { 
      background: #e7f7ec; 
      border: 1px solid #b9ebc9; 
      color: #246b3d; 
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card-header { padding: 24px 20px; }
      .card-body { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="icon">🏛️</div>
      <h1>Bem-vindo de volta!</h1>
      <p>Entre para explorar o Recife histórico</p>
    </div>
    <div class="card-body">
      <form method="POST" action="/login">
        <div class="input-group">
          <label for="username">Usuário</label>
          <input id="username" name="username" type="text" placeholder="Seu nome de usuário" required />
        </div>
        <div class="input-group">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" placeholder="Sua senha" required />
        </div>
        <button class="btn" type="submit">Entrar</button>
        {% if error %}
        <div class="msg error">{{ error }}</div>
        {% endif %}
      </form>
      <div class="divider"><span>ou</span></div>
      <div class="links">
        <a href="/register" class="btn btn-secondary">Criar nova conta</a>
        <a href="/reset">Esqueci minha senha</a>
      </div>
    </div>
  </div>
</body>
</html>
