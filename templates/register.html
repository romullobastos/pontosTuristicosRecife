<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>Cadastrar • Recife Turístico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
    }
    .card { 
      background: #fff; 
      border-radius: 24px; 
      box-shadow: 0 25px 50px rgba(0,0,0,0.25); 
      max-width: 420px; 
      width: 100%; 
      overflow: hidden;
    }
    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 32px 28px;
      text-align: center;
      color: white;
    }
    .card-header .icon {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }
    .card-header h1 { 
      font-size: 24px; 
      font-weight: 700;
      margin-bottom: 6px;
    }
    .card-header p { 
      opacity: 0.9; 
      font-size: 14px; 
    }
    .card-body {
      padding: 28px;
    }
    .input-group { margin-bottom: 18px; }
    .input-group label { 
      display: block; 
      margin-bottom: 8px; 
      color: #444; 
      font-weight: 600; 
      font-size: 14px; 
    }
    .input-group input { 
      width: 100%; 
      padding: 14px 16px; 
      border: 2px solid #e8e8f0; 
      border-radius: 12px; 
      font-size: 15px; 
      transition: all 0.2s ease;
    }
    .input-group input:focus { 
      outline: none; 
      border-color: #667eea; 
      box-shadow: 0 0 0 4px rgba(102,126,234,0.15); 
    }
    .btn { 
      width: 100%; 
      border: none; 
      border-radius: 12px; 
      padding: 14px 20px; 
      color: #fff; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      font-weight: 700; 
      font-size: 15px;
      cursor: pointer; 
      margin-top: 8px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102,126,234,0.4);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #999;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e8e8f0;
    }
    .divider span { padding: 0 16px; }
    .links { 
      text-align: center;
    }
    .links a { 
      color: #667eea; 
      text-decoration: none; 
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .links a:hover { 
      color: #764ba2;
    }
    .msg { 
      display: none; 
      margin-top: 16px; 
      padding: 12px 14px; 
      border-radius: 10px; 
      font-size: 14px;
      text-align: center;
    }
    .msg.error { 
      background: #ffeaea; 
      border: 1px solid #f3b5b5; 
      color: #b42323; 
    }
    .msg.success { 
      background: #e7f7ec; 
      border: 1px solid #b9ebc9; 
      color: #246b3d; 
    }
    .password-hint {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card-header { padding: 24px 20px; }
      .card-body { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="icon">🎮</div>
      <h1>Criar conta</h1>
      <p>Comece sua jornada pelo Recife histórico</p>
    </div>
    <div class="card-body">
      <form id="registerForm" method="POST" action="/register">
        <div class="input-group">
          <label for="username">Usuário</label>
          <input id="username" name="username" type="text" placeholder="Escolha um nome de usuário" required />
        </div>
        <div class="input-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="seu@email.com" required />
        </div>
        <div class="input-group">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" required />
          <p class="password-hint">Use letras e números para maior segurança</p>
        </div>
        <div id="formMsg" class="msg"></div>
        <button id="submitBtn" class="btn" type="submit">Criar minha conta</button>
        {% if error %}
        <div class="msg error" style="display: block;">{{ error }}</div>
        {% endif %}
      </form>
      <div class="divider"><span>ou</span></div>
      <div class="links">
        <span style="color: #666; font-size: 14px;">Já tem uma conta?</span>
        <a href="/login">Fazer login</a>
      </div>
    </div>
  </div>
  <script>
    (function(){
      const form = document.getElementById('registerForm');
      const msg = document.getElementById('formMsg');
      const btn = document.getElementById('submitBtn');
      
      function showError(text) { 
        msg.className = 'msg error'; 
        msg.textContent = text; 
        msg.style.display = 'block'; 
      }
      
      form.addEventListener('submit', function(e) {
        const u = document.getElementById('username').value.trim();
        const em = document.getElementById('email').value.trim();
        const pw = document.getElementById('password').value;
        const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
        msg.style.display = 'none';
        
        if (u.length < 3) { 
          e.preventDefault(); 
          return showError('O usuário deve ter pelo menos 3 caracteres.'); 
        }
        if (!emailRe.test(em)) { 
          e.preventDefault(); 
          return showError('Informe um email válido.'); 
        }
        if (pw.length < 6) { 
          e.preventDefault(); 
          return showError('A senha deve ter pelo menos 6 caracteres.'); 
        }
        
        btn.disabled = true; 
        btn.textContent = 'Criando conta...';
      });
    })();
  </script>
</body>
</html>
