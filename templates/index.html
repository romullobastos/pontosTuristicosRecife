<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>Recife Turístico - App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .dashboard { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 1; }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header-brand .logo {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .header-brand h1 {
            font-size: 1.4em;
            background: linear-gradient(135deg, #fff 0%, #a8b4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions { display: flex; gap: 10px; }
        .header-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .header-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .header-btn.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
        }
        .header-btn.primary:hover { box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .header-btn.danger {
            background: rgba(255, 100, 100, 0.15);
            border-color: rgba(255, 100, 100, 0.3);
            color: #ff9999;
            display: none;
        }

        .user-greeting {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .user-greeting strong {
            color: #a8b4ff;
        }

        /* Content */
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        .content::-webkit-scrollbar { width: 6px; }
        .content::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .content::-webkit-scrollbar-thumb { background: rgba(102, 126, 234, 0.4); border-radius: 10px; }

        /* Welcome Banner */
        .welcome-banner {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .welcome-text h2 { font-size: 1.8em; margin-bottom: 8px; }
        .welcome-text p { opacity: 0.8; font-size: 1.05em; }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            animation: fadeInUp 0.6s ease;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .card-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .card-header h3 { font-size: 1.2em; }

        /* Achievements */
        .achievements-list { min-height: 300px; max-height: 450px; overflow-y: auto; }
        .achievement-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .achievement-icon { font-size: 1.8em; }
        .achievement-info { flex: 1; }
        .achievement-name { font-weight: 600; margin-bottom: 2px; }
        .achievement-desc { font-size: 0.85em; opacity: 0.7; }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.6;
        }
        .empty-state .icon { font-size: 3em; margin-bottom: 15px; }

        /* Leaderboard */
        .leaderboard-list { min-height: 300px; max-height: 450px; overflow-y: auto; padding-right: 5px; }
        .leaderboard-list::-webkit-scrollbar { width: 5px; }
        .leaderboard-list::-webkit-scrollbar-thumb { background: rgba(102, 126, 234, 0.4); border-radius: 10px; }
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }
        .leaderboard-item:hover { background: rgba(255, 255, 255, 0.08); transform: translateX(5px); }
        .rank {
            font-size: 1.3em; font-weight: 700; min-width: 45px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #ffed4e); -webkit-background-clip: text; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #e8e8e8); -webkit-background-clip: text; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #daa06d); -webkit-background-clip: text; }
        .player-info { flex-grow: 1; margin-left: 12px; }
        .player-name { font-weight: 600; margin-bottom: 3px; }
        .player-level { color: rgba(255, 255, 255, 0.6); font-size: 0.85em; }
        .use-btn {
            background: rgba(102, 126, 234, 0.2);
            color: #a8b4ff;
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }
        .use-btn:hover { background: rgba(102, 126, 234, 0.35); }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal {
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .modal-header h3 { font-size: 1.3em; }
        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.3s;
        }
        .modal-close:hover { background: rgba(255, 255, 255, 0.2); }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            color: #fff;
            transition: all 0.3s ease;
        }
        .input-group input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.12);
        }

        .error-msg {
            margin: 10px 0;
            color: #ff9999;
            background: rgba(255, 100, 100, 0.15);
            border: 1px solid rgba(255, 100, 100, 0.3);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9em;
            display: none;
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }

        .hidden { display: none !important; }

        /* Mobile */
        @media (max-width: 900px) {
            .cards-grid { grid-template-columns: 1fr; }
            .welcome-banner { flex-direction: column; text-align: center; gap: 20px; }
        }
        @media (max-width: 600px) {
            .header { padding: 12px 16px; gap: 10px; }
            .header-brand { display: none; }
            .header-actions { 
                width: 100%; 
                align-items: center;
            }
            .user-greeting { 
                padding: 8px 12px;
                font-size: 13px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 140px;
                margin-right: auto;
            }
            .header-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
            .header-btn.primary {
                padding: 8px 14px;
            }
            .header-btn.primary span {
                display: none;
            }
            .header-btn.primary::before {
                content: '+';
                font-size: 16px;
                font-weight: bold;
            }
            .content { padding: 20px 16px; }
            .welcome-banner { padding: 20px; }
            .welcome-text h2 { font-size: 1.4em; }
            .glass-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div class="header-brand">
                <div class="logo">🏛️</div>
                <h1>Recife Turístico</h1>
            </div>
            <div class="header-actions">
                <span id="userGreeting" class="user-greeting" style="display:none;">Olá, <strong id="userName"></strong></span>
                <button class="header-btn primary" onclick="openModal()"><span>+ Novo Jogador</span></button>
                <button id="resetRankingBtn" class="header-btn danger" onclick="resetRanking()">Resetar</button>
                <button id="logoutBtn" class="header-btn" onclick="logoutUser()" style="display:none;">Sair</button>
            </div>
        </header>

        <main class="content">
            <div class="welcome-banner">
                <div class="welcome-text">
                    <h2>Desvende os segredos do Recife</h2>
                    <p>Participe de um desafio fotográfico, identifique locais históricos e suba no ranking.</p>
                </div>
                <div>
                    <button class="btn" onclick="startGame()">Começar Agora</button>
                </div>
            </div>

            <div class="cards-grid">
                <!-- Card Conquistas -->
                <div class="glass-card">
                    <div class="card-header">
                        <div class="card-icon">🏆</div>
                        <h3>Conquistas Recentes</h3>
                    </div>
                    <div id="achievementsList" class="achievements-list">
                        <div class="empty-state">
                            <div class="icon">🏆</div>
                            <p>Suas medalhas e troféus aparecerão aqui. Comece a jogar para colecioná-los!</p>
                        </div>
                    </div>
                </div>

                <!-- Card Ranking -->
                <div class="glass-card">
                    <div class="card-header">
                        <div class="card-icon">📊</div>
                        <h3>Ranking</h3>
                    </div>
                    <div id="leaderboardList" class="leaderboard-list">
                        <p style="opacity: 0.6; text-align: center; padding: 20px;">Carregando...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Criar Jogador -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>👤 Criar Jogador</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="input-group">
                <label for="playerName">Nome do Jogador</label>
                <input type="text" id="playerName" placeholder="Digite seu nome" value="Jogador">
            </div>
            <div id="nameError" class="error-msg"></div>
            <button class="btn" onclick="createPlayer()">🎮 Criar e Jogar</button>
        </div>
    </div>

    <script>
        const ACHIEVEMENTS_MAP = {
            'first_image': { icon: '📸', name: 'Primeira Foto', desc: 'Enviou sua primeira imagem' },
            'detective_novice': { icon: '🔍', name: 'Detetive Novato', desc: 'Identificou 5 locais' },
            'perfect_streak': { icon: '🔥', name: 'Sequência Perfeita', desc: 'Acertou 5 seguidos' },
            'history_expert': { icon: '📚', name: 'Expert em História', desc: 'Identificou 20 locais' },
            'speed_demon': { icon: '⚡', name: 'Velocista', desc: 'Resposta super rápida' }
        };

        try { window.currentPlayerId = localStorage.getItem('player_id') || null; } catch (e) {}

        document.addEventListener('DOMContentLoaded', async () => {
            // Mostrar nome do jogador salvo
            const savedName = localStorage.getItem('player_name');
            if (savedName) {
                document.getElementById('userGreeting').style.display = 'block';
                document.getElementById('userName').textContent = savedName;
            }

            try {
                const me = await fetch('/me');
                if (me.ok) {
                    document.getElementById('logoutBtn').style.display = 'block';
                    const data = await me.json();
                    if (data.is_admin) document.getElementById('resetRankingBtn').style.display = 'block';
                }
            } catch (e) {}
            loadHomeLeaderboard();
            loadAchievements();
        });

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('playerName').focus();
        }

        function closeModal(e) {
            if (!e || e.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        }

        async function logoutUser() {
            try { await fetch('/logout', { method:'POST' }); } catch (e) {}
            try { localStorage.removeItem('player_id'); localStorage.removeItem('player_name'); } catch (e) {}
            window.location.href = '/login';
        }

        async function resetRanking() {
            const btn = document.getElementById('resetRankingBtn');
            try {
                btn.disabled = true; btn.textContent = '...';
                await fetch('/api/admin/reset_players', { method: 'POST' });
                await fetch('/api/admin/reload_players', { method: 'POST' });
                await loadHomeLeaderboard();
                await loadAchievements();
            } catch (e) {} finally {
                btn.disabled = false; btn.textContent = 'Resetar';
            }
        }

        function startGame() {
            const savedId = localStorage.getItem('player_id');
            if (savedId) {
                window.location.href = '/chatbot';
            } else {
                openModal();
            }
        }

        async function selectMyPlayer(id, name) {
            if (!id) return;
            localStorage.setItem('player_id', String(id));
            localStorage.setItem('player_name', name || 'Jogador');
            window.location.href = '/chatbot';
        }

        async function createPlayer() {
            const name = document.getElementById('playerName').value.trim();
            const nameError = document.getElementById('nameError');
            nameError.style.display = 'none';
            
            if (!name || name.length < 3) {
                nameError.textContent = 'Nome deve ter pelo menos 3 caracteres.';
                nameError.style.display = 'block';
                return;
            }

            try {
                const lb = await fetch('/api/leaderboard');
                const list = await lb.json();
                if (Array.isArray(list) && list.some(p => (p.name||'').toLowerCase() === name.toLowerCase())) {
                    nameError.textContent = 'Este nome já está em uso.';
                    nameError.style.display = 'block';
                    return;
                }
            } catch (e) {}

            try {
                const response = await fetch('/api/create_player', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                const result = await response.json();
                
                if (result.success) {
                    localStorage.setItem('player_id', result.player_id);
                    localStorage.setItem('player_name', name);
                    window.location.href = '/chatbot';
                } else {
                    nameError.textContent = result.error || 'Erro ao criar';
                    nameError.style.display = 'block';
                }
            } catch (error) {
                nameError.textContent = 'Erro de conexão';
                nameError.style.display = 'block';
            }
        }

        async function loadAchievements() {
            const listEl = document.getElementById('achievementsList');
            const playerId = localStorage.getItem('player_id');
            
            if (!playerId) {
                listEl.innerHTML = `<div class="empty-state"><div class="icon">👤</div><p>Crie um perfil de jogador para começar a colecionar conquistas!</p></div>`;
                return;
            }

            try {
                const response = await fetch(`/api/player_stats/${playerId}`);
                const stats = await response.json();
                
                if (stats.error || !stats.achievements || stats.achievements.length === 0) {
                    listEl.innerHTML = `<div class="empty-state"><div class="icon">🎯</div><p>Jogue para desbloquear conquistas!</p></div>`;
                    return;
                }

                listEl.innerHTML = stats.achievements.map(achId => {
                    const ach = ACHIEVEMENTS_MAP[achId] || { icon: '🏅', name: achId, desc: '' };
                    return `
                        <div class="achievement-item">
                            <div class="achievement-icon">${ach.icon}</div>
                            <div class="achievement-info">
                                <div class="achievement-name">${ach.name}</div>
                                <div class="achievement-desc">${ach.desc}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                listEl.innerHTML = `<div class="empty-state"><div class="icon">🎮</div><p>Jogue para desbloquear conquistas!</p></div>`;
            }
        }

        async function loadHomeLeaderboard() {
            try {
                let me = null;
                try { const meResp = await fetch('/me'); if (meResp.ok) me = await meResp.json(); } catch(e){}

                const response = await fetch('/api/leaderboard');
                const leaderboard = await response.json();
                const listEl = document.getElementById('leaderboardList');

                if (!Array.isArray(leaderboard) || leaderboard.length === 0) {
                    listEl.innerHTML = '<p style="opacity: 0.6; text-align: center; padding: 20px;">Nenhum jogador ainda!</p>';
                    return;
                }

                listEl.innerHTML = leaderboard.map(p => {
                    const myIds = (me && Array.isArray(me.player_ids)) ? me.player_ids.map(x => String(x)) : [];
                    const canUse = myIds.includes(String(p.id||''));
                    const safeName = String(p.name||'').replace(/"/g, '&quot;');
                    const btn = canUse ? `<button class="use-btn" onclick="selectMyPlayer('${String(p.id)}','${safeName}')">Usar</button>` : '';
                    const rankClass = p.rank <= 3 ? `rank-${p.rank}` : '';
                    return `
                    <div class="leaderboard-item">
                        <div class="rank ${rankClass}">#${p.rank}</div>
                        <div class="player-info">
                            <div class="player-name">${p.name}</div>
                            <div class="player-level">Nível ${p.level} • ${p.experience} XP</div>
                        </div>
                        ${btn}
                    </div>`;
                }).join('');
            } catch (e) {}
        }

        document.getElementById('playerName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createPlayer();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
